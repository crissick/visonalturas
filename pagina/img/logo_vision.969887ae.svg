<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460">
  <!-- techo: más ancho, sale de detrás de las torres -->
  <polygon points="110,262 340,10 570,262" fill="#1e5f6f"/>
  <polygon points="154,262 340,58 526,262" fill="#ffffff"/>
  <polygon points="185,262 340,92 340,262" fill="#2b2b2b"/>
  <polygon points="340,92 495,262 340,262" fill="#111111"/>

  <!-- torre izquierda: cabeza ancha que se angosta en diagonal -->
  <path d="M60,290 V140 L40,110 V6 H80 V40 H115 V6 H135 V290 Z" fill="#0f3640"/>
  <path d="M135,290 V6 H155 V40 H190 V6 H230 V110 L210,140 V290 Z" fill="#1e5f6f"/>

  <!-- torre derecha: igual, en espejo -->
  <path d="M470,290 V140 L450,110 V6 H490 V40 H525 V6 H545 V290 Z" fill="#1e5f6f"/>
  <path d="M545,290 V6 H565 V40 H600 V6 H640 V110 L620,140 V290 Z" fill="#0f3640"/>

  <!-- ojo al 80 %, adelante, con borde blanco que lo separa del castillo -->
  <g transform="translate(340,320) scale(0.8) translate(-340,-330)">
    <path d="M20,330 C140,130 540,130 660,330 C540,530 140,530 20,330 Z" fill="#ffffff" stroke="#ffffff" stroke-width="88" stroke-linejoin="round"/>
    <path d="M20,330 C140,130 540,130 660,330 C540,530 140,530 20,330 Z" fill="#ffffff" stroke="#111111" stroke-width="28"/>

    <!-- aro negro, iris azul, pupila y dos brillos -->
    <circle cx="340" cy="330" r="134" fill="#ffffff" stroke="#111111" stroke-width="26"/>
    <circle cx="340" cy="330" r="92" fill="#1e5f6f"/>
    <circle cx="340" cy="330" r="52" fill="#111111"/>
    <circle cx="370" cy="300" r="20" fill="#ffffff"/>
    <circle cx="314" cy="358" r="7" fill="#ffffff"/>
  </g>
</svg>
